<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>G9 TV · 本地创作工作台</title><link rel="stylesheet" href="/simple-studio/static/director.css"></head>
<body>
<style>
main{grid-template-columns:210px minmax(350px,1fr) 350px}textarea{user-select:text;caret-color:#efc894;tab-size:2}#properties textarea{min-height:170px;line-height:1.85;padding:12px;font-size:14px;scrollbar-gutter:stable}textarea:focus,input:focus{box-shadow:0 0 0 3px #dfb27718}input[aria-invalid=true]{border-color:#ef9494}.editor-tools{display:flex;justify-content:space-between;align-items:center;margin-top:6px;color:#8d99aa}.editor-tools button{font-size:11px;padding:3px 9px}.expanded-editor{display:block;width:100%;height:50vh;resize:vertical;line-height:1.9;padding:18px;font-size:16px}.card-header{touch-action:none}.port{width:16px;height:16px;transition:box-shadow .12s,transform .12s}.port:hover{transform:scale(1.25);box-shadow:0 0 0 5px #dfb27733}.port-row{height:23px}#properties{padding-bottom:50px}#inspector{scrollbar-gutter:stable}#save-state{max-width:160px}
.canvas-toolbar{max-width:calc(100% - 30px);flex-wrap:wrap}.canvas-toolbar button{padding:6px 9px}.output-details{margin:16px 0;border:1px solid #394457;border-radius:9px;background:#121a26;padding:10px}.output-details summary{cursor:pointer;color:#dfb277;font-size:12px;line-height:1.8}.output-details[open] summary{padding-bottom:9px;border-bottom:1px solid #354052}.card-inputs{margin-top:10px;border-top:1px solid #303c4e;padding-top:8px}.card-inputs summary{cursor:pointer;font-size:11px;color:#9daec4}.card-inputs[open] summary{color:#dfb277}.template-menu{display:flex;flex-wrap:wrap;gap:6px;padding:10px 0}.template-menu button{font-size:11px}.wire-menu{position:fixed;z-index:50;width:220px;background:#1b2635;border:1px solid #6d7e96;border-radius:10px;padding:12px;box-shadow:0 15px 50px #0008;display:flex;flex-direction:column;gap:8px}.wire-menu b{font-size:12px;color:#dfb277}.port.compatible{box-shadow:0 0 0 4px #8dba9b88}.layout-review{position:absolute;left:18px;bottom:110px;z-index:6;border:1px solid #a58155;border-radius:9px;background:#2c241e;padding:12px;display:flex;gap:10px;align-items:center;font-size:12px}#wire-preview{stroke-dasharray:7 5}#wire-tip{pointer-events:none}

<style id="studio-theme">
:root{--bg:#0b0d13;--panel:#12151e;--line:#ffffff0e;--muted:#858c9f;--ink:#e9eaf0;--accent:#b3a0ff;--blue:#82b9ea;--purple:#b3a0ff}
body{font-family:"Segoe UI Variable","Microsoft YaHei UI","Microsoft YaHei",sans-serif;background:radial-gradient(ellipse at 48% 0,#29233e55,transparent 55%),#0b0d13;font-size:12px}
button,input,select,textarea{transition:background-color .16s,border-color .16s,box-shadow .16s,color .16s}
button{border-color:#ffffff12;background:#ffffff05;border-radius:9px;color:#cbd0df;font-weight:500}
button:hover{background:#ffffff0c;border-color:#b3a0ff55;color:#fff}
button:active{transform:translateY(1px)}
button:focus-visible,summary:focus-visible{outline:2px solid #b3a0ff;outline-offset:3px}
header{height:72px;border-bottom:1px solid #ffffff09;background:#0e1018dd;padding:12px 22px;gap:10px}
.brand{min-width:190px;margin-right:16px;gap:12px}.brand b{font-size:17px;letter-spacing:1px}.brand small{font-size:8px;color:#747b93;letter-spacing:2.6px}.logo{width:37px;height:37px;border-radius:12px;background:linear-gradient(145deg,#ba9bff22,#7ba9ff0d);border:1px solid #baa4ff30;text-align:center;line-height:34px;font-size:25px;color:#c7b8ff}
header input,header select{height:35px;border-color:#ffffff0c;background:#ffffff03}#project-name{width:175px;font-size:12px}#projects{width:150px;font-size:12px}#new-project{font-size:12px;height:35px}#save-state{font-size:10px;color:#7c879b;white-space:nowrap}.local-badge{color:#8cb8a4;font-size:10px;border:1px solid #81b39920;background:#81b39908;padding:5px 9px;border-radius:20px}
#chain{background:linear-gradient(135deg,#8970da,#6d5eb2);border-color:#c8baff28;color:#fff;box-shadow:0 4px 20px #8b70db15;font-size:12px}#chain:hover{background:linear-gradient(135deg,#9c85ed,#8270cc)}#help,#exit,#focus-mode{font-size:11px}
main{height:calc(100vh - 216px);grid-template-columns:224px minmax(350px,1fr) 340px;gap:12px;padding:12px 14px 10px}
aside{background:linear-gradient(155deg,#161924,#11141c);border:1px solid #ffffff0c!important;border-radius:15px;scrollbar-width:thin;scrollbar-color:#ffffff18 transparent}
.library{padding:18px 13px}.section-label{font-size:10px;letter-spacing:1.8px;color:#a0a5b8;margin-bottom:14px}.section-label span{font-size:9px;letter-spacing:1px;color:#555e74}
#tools{gap:7px;margin-bottom:24px}#tools button{background:#1a1e2a80;border-color:#ffffff08;padding:13px 10px;min-height:76px;font-size:11px;transition:background .18s,border-color .18s,transform .18s}#tools button:hover{transform:translateY(-2px);border-color:#b3a0ff45;background:#252238}#tools .tool-icon{font-size:20px;color:#baacdf;margin:0 0 7px}
#upload{font-size:11px;padding:9px;border-style:dashed;border-color:#ffffff20;margin:0 0 13px;background:#ffffff02}.asset{border-bottom:0;border-radius:9px;padding:8px 6px;margin:2px 0;grid-template-columns:56px 1fr;transition:background .16s}.asset:hover{background:#ffffff06}.asset img,.asset video{border:1px solid #ffffff0d;border-radius:6px;height:46px}.asset span{font-size:10px;color:#c6ccdb}.asset small{font-size:9px;color:#6e788e;margin-top:4px}.library-footer{font-size:10px;color:#626e83;border-top:1px solid #ffffff08;margin-top:12px}.library-footer a{color:#a99acb}
.asset-search{width:100%;margin-bottom:8px;border:1px solid #ffffff0c;background:#0b1019;padding:8px 10px;font-size:11px}
#canvas{border:1px solid #ffffff0b;border-radius:15px;background-color:#0e111a;background-image:radial-gradient(#3d425c88 .7px,transparent .7px);background-size:24px 24px;box-shadow:inset 0 0 90px #0002}
.canvas-label{top:17px;left:20px;color:#a8aec0;letter-spacing:1px;font-size:11px}.canvas-label span{font-size:9px;color:#566079;letter-spacing:0}.canvas-label:before{content:"";display:inline-block;width:6px;height:6px;background:#ad9adb;border-radius:50%;margin-right:9px;box-shadow:0 0 12px #b3a0ff55}
.card{background:linear-gradient(150deg,#1b1e2b,#161a25);border-color:#353a4d;border-radius:14px;box-shadow:0 8px 24px #0003;transition:border-color .16s,box-shadow .16s}
.card:hover{border-color:#596179}.card.selected{border-color:#ac98ee;box-shadow:0 0 0 1px #a795e52b,0 14px 40px #0005}.card-header{border-color:#ffffff07;padding:12px 14px;min-height:45px;font-size:12px;font-weight:600;letter-spacing:.3px}.card-header:before{content:"";width:6px;height:6px;margin-right:8px;border-radius:2px;background:var(--card-accent,#a89ac9)}.card-header>span:first-child{flex:1}.kind{font-size:8px;letter-spacing:1.1px;color:#69738c}.card-body{padding:11px}.card-media{border-radius:8px;background:#090c13;max-height:235px}.empty-media{height:150px;background:radial-gradient(ellipse at center,#24223455,transparent 80%),#10131d;color:#626c84;font-size:11px;border:1px dashed #ffffff09;border-radius:9px}.empty-media:before{content:"◇";font-size:26px;display:block;color:#75668f;margin-right:9px}.card-text{line-height:1.85;color:#bbc3d6;font-size:11px;max-height:145px}.card-status{font-size:9px;color:#778299;padding:9px 0 3px}.card-actions{gap:7px}.card-actions button{font-size:10px;padding:6px 11px;border-radius:7px}.card-actions button:first-child{background:#a28adb1a;border-color:#a28adb30;color:#c5b4f0}.card-inputs{border-color:#ffffff08;padding-top:9px}.card-inputs summary{font-size:10px;color:#79869e}.card-inputs[open] summary{color:#b7a3dd}.port-row{font-size:9px}.port{width:13px;height:13px;border-width:3px;border-color:#191e2b;box-shadow:0 0 0 1px #7d99b8}.port-row .pin{color:#8ea5a0;font-size:8px}
.canvas-toolbar{left:50%;bottom:15px;transform:translateX(-50%);width:max-content;max-width:calc(100% - 26px);background:#191d29f2;border-color:#ffffff12;border-radius:12px;padding:6px;box-shadow:0 8px 35px #0005;gap:4px;backdrop-filter:blur(14px)}.canvas-toolbar button{border-color:transparent;background:transparent;font-size:10px;padding:7px 9px}.canvas-toolbar button:hover{background:#ffffff09}#zoom-label{font-size:10px;min-width:37px}.layout-review{bottom:85px;background:#242033f5;border-color:#8e79bf55}.layout-review button{font-size:10px}#wire-tip{bottom:74px;font-size:11px;background:#332a46eb;color:#d3bff7;border:1px solid #b397e830;padding:8px 15px}
#inspector{padding:18px 16px}#properties h2{font-size:17px;font-weight:600;margin:8px 0 22px}#properties label{font-size:11px;color:#9ca7bd;margin:15px 0}#properties label>span{margin-bottom:7px}#properties input,#properties select,#properties textarea{background:#0d111a;border-color:#ffffff0e;border-radius:9px;color:#dce2ef;font-size:12px}#properties textarea{padding:12px;line-height:1.9;min-height:155px}#properties input:focus,#properties textarea:focus,#properties select:focus{outline:none;border-color:#a18ac1;box-shadow:0 0 0 3px #a18ac110}#properties .hint{font-size:10px;color:#6e7c94;line-height:1.8}.editor-tools{margin-top:8px;font-size:9px}.editor-tools button{font-size:10px;color:#8d9bb3;background:transparent;border-color:#ffffff0b}.output-details{background:#10141f;border-color:#ffffff0b;border-radius:10px;padding:11px}.output-details summary{font-size:11px;color:#b2a1d3;line-height:1.8}.primary{background:linear-gradient(135deg,#8e75cf,#7561ad);border-color:#c4abe724;color:#fff;border-radius:9px;font-size:12px;min-height:37px;box-shadow:0 4px 18px #8e75cf0d}.primary:hover{background:linear-gradient(135deg,#a38ae1,#8772be)}.ref-list{border-color:#ffffff09;padding-top:16px}.ref-list>b{font-size:10px;letter-spacing:1px;color:#99a4bc}.ref-item{font-size:10px;padding:8px 0}.version{border-color:#ffffff08}.version img,.version video{border-radius:6px}.version.active{color:#beadf1}
footer{height:144px;background:transparent;border-top:0;padding:3px 16px 12px}.footer-top{height:25px;font-size:10px;color:#78849c}.footer-top b{font-size:11px;color:#aeb9ce;font-weight:500}.footer-top>span{font-size:10px}#connection{font-size:10px;color:#829b94}#jobs{gap:9px;margin-top:6px;max-height:91px;scrollbar-width:thin;scrollbar-color:#ffffff16 transparent}.job{background:linear-gradient(140deg,#191d28,#121722);border-color:#ffffff0b;min-width:225px;border-radius:10px;padding:10px 12px;font-size:10px}.job .state{font-size:9px;color:#b2a0db}.job b{font-weight:500}.job>div{margin-top:4px;color:#74849d}.job small{font-size:9px}.task-toggle{padding:3px 7px;font-size:10px;border:0;color:#74839c}
.history-collapsed footer{height:44px}.history-collapsed #jobs{display:none}.history-collapsed main{height:calc(100vh - 116px)}
.focus-canvas main{grid-template-columns:0 minmax(350px,1fr) 0;gap:0}.focus-canvas main>aside{visibility:hidden;padding:0;border:0!important}.focus-canvas #canvas{border-radius:15px}
.context-menu{position:fixed;z-index:60;min-width:240px;padding:8px;border:1px solid #8c83a92e;border-radius:13px;background:#1b1e2bf5;box-shadow:0 20px 70px #0008;backdrop-filter:blur(18px);animation:menu-enter .13s ease-out;max-height:calc(100vh - 24px);overflow:auto}.context-menu h4{font-size:10px;font-weight:500;letter-spacing:1.3px;color:#76829d;padding:6px 10px;margin:0}.context-menu button{display:flex;align-items:center;gap:10px;width:100%;border:0;text-align:left;background:transparent;padding:9px 10px;font-size:12px;color:#c5ccde;border-radius:7px}.context-menu button:hover,.context-menu button:focus-visible{background:#a38ac91a;color:#e7d7ff}.context-menu .menu-symbol{width:19px;text-align:center;color:#b5a1d3;font-size:15px}.context-menu kbd{margin-left:auto;font-family:inherit;font-size:9px;color:#69758e}.context-menu hr{border:0;border-top:1px solid #ffffff09;margin:6px}.context-menu button.danger{color:#d999ac}.context-menu button:disabled{opacity:.35;cursor:not-allowed}.context-menu button:hover{transform:none}
#toast{background:#272135f5;border-color:#a98bce38;color:#dac9f2;font-size:12px;box-shadow:0 10px 50px #0004;animation:menu-enter .15s ease-out}dialog{border-color:#9f89c62c;background:#161a25;border-radius:17px;box-shadow:0 30px 120px #0009;animation:menu-enter .15s ease-out}dialog::backdrop{background:#03060bc7;backdrop-filter:blur(4px)}#wires path{stroke-width:1.7;opacity:.78;transition:opacity .15s,stroke-width .15s}#wires path:hover{opacity:1;stroke-width:4}.card.just-added{animation:card-enter .2s ease-out}.card.is-running{border-color:#9b87cb}.card.is-running .card-status:before{content:"";display:inline-block;width:6px;height:6px;background:#bda2ef;border-radius:50%;margin-right:7px;animation:status-pulse 1.5s ease-in-out infinite}.card.is-running .empty-media{background:linear-gradient(100deg,#121520 20%,#211d30 50%,#121520 80%);background-size:220% 100%;animation:loading-shimmer 2s linear infinite}
@keyframes card-enter{from{opacity:0;translate:0 7px}to{opacity:1;translate:0 0}}@keyframes menu-enter{from{opacity:0;translate:0 4px;scale:.985}to{opacity:1;translate:0 0;scale:1}}@keyframes status-pulse{50%{opacity:.35;box-shadow:0 0 0 4px #bda2ef10}}@keyframes loading-shimmer{to{background-position:-220% 0}}
@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation:none!important;transition:none!important;scroll-behavior:auto!important}}
@media(max-width:1400px){main{grid-template-columns:190px minmax(300px,1fr) 305px}.brand{min-width:150px;margin-right:0}header{padding:10px 14px;gap:7px}#project-name{width:130px}#projects{max-width:130px}.local-badge{display:none}}
@media(max-width:1100px){#project-name,#save-state{display:none}main{grid-template-columns:160px minmax(280px,1fr) 270px;gap:8px;padding:8px}.brand{min-width:140px}.brand b{font-size:15px}.brand small{font-size:7px}#tools button{padding:10px 7px}#help{display:none}}
</style>
<header><div class="brand"><span class="logo">◈</span><div><b>G9 TV</b><small>LOCAL CREATIVE STUDIO</small></div></div><select id="projects" aria-label="选择项目"></select><button id="new-project">＋ 新项目</button><input id="project-name" aria-label="项目名称"><span id="save-state">已保存</span><div class="spacer"></div><span class="local-badge">● 本地运行</span><button id="focus-mode" aria-pressed="false">专注画布</button><button id="chain">运行整条链</button><button id="help">使用说明</button><button id="exit">返回节点 ↗</button></header>
<main>
<aside class="library"><div class="section-label">创作工具 <span>01</span></div><div id="tools"></div><div class="section-label">项目素材 <span id="asset-count">0</span></div><button id="upload" class="wide">＋ 导入图片 / 视频</button><input id="file" type="file" accept="image/png,image/jpeg,image/webp,image/bmp,video/mp4,video/quicktime,video/webm,video/x-matroska" multiple hidden><div id="assets"></div><div class="library-footer">图片先确认，再进入视频<br><a href="#" id="trellis">打开 TRELLIS 工作流说明 ↗</a></div></aside>
<section id="canvas"><div class="canvas-label">创作画布 <span>右键添加卡片 · 拖线连接 · 空格拖动画布</span></div><div id="world"><svg id="wires" width="12000" height="12000"></svg><div id="cards"></div></div><div id="selection-box" hidden></div><div class="canvas-toolbar"><button id="zoom-out">−</button><span id="zoom-label">100%</span><button id="zoom-in">＋</button><button id="fit">适应画布</button><button id="duplicate">复制</button><button id="delete">删除</button></div><div id="wire-tip" hidden>选择目标输入端口 · Esc 取消</div></section>
<aside id="inspector"><div class="section-label">参数与参考 <span>02</span></div><div id="properties"></div></aside>
</main>
<footer><div class="footer-top"><b>生成任务与结果</b><span id="task-count"></span><div class="spacer"></div><span id="connection">正在连接后台…</span></div><div id="jobs"></div></footer>
<div id="toast" role="status" hidden></div><dialog id="dialog"><div id="dialog-content"></div><button id="dialog-close">关闭</button></dialog>
<script type="module" src="/simple-studio/static/director-app.js"></script><script type="module" src="/simple-studio/sound/static/sound-launcher.mjs"></script></body></html>
