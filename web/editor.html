<!doctype html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>G9 TV · 独立剪辑台</title><link rel="stylesheet" href="/simple-studio/static/editor.css"></head><body><header><b>G9 TV <small>剪辑工作台</small></b><span id="project"></span><button id="import">导入素材</button><button id="save">保存</button><button id="export">导出视频 MP4</button><button id="wav">导出音频 WAV</button></header><main><aside id="library"><h3>素材库</h3><input id="search" placeholder="搜索素材"><button id="refresh">刷新画布素材</button><div id="assets"></div></aside><section id="viewer"><canvas id="screen" width="1280" height="720"></canvas><div id="time">00:00.00</div><p id="status">将外部图片、视频、声音拖入此窗口</p></section><aside id="props"></aside></main><section id="timeline"><nav><button id="play">▶ 播放</button><button id="split">分割</button><button id="copy">复制</button><button id="delete">删除</button><button id="ripple">波纹删除</button><button id="undo">撤销</button><button id="redo">重做</button><button id="video-track">＋画面轨</button><button id="audio-track">＋音轨</button><button id="text">＋文字</button><button id="srt-import">导入字幕</button><button id="srt-export">导出字幕</button><label>吸附<input id="snap" type="checkbox" checked></label><label>缩放<input id="zoom" type="range" min="10" max="120" value="50"></label><input id="seek" type="number" min="0" step=".01" value="0" aria-label="播放位置"><select id="ratio"><option value="1280x720">16:9 · 720P</option><option value="1920x1080">16:9 · 1080P</option><option value="1080x1920">9:16 · 1080P</option><option value="1080x1080">1:1 · 1080</option><option value="3840x2160">16:9 · 4K</option></select></nav><div id="scroll"><div id="sheet"></div></div><footer>拖动素材到轨道 · 拖动两端裁剪 · Space 播放 · Ctrl+S 保存 · Ctrl+Z 撤销 · Delete 删除</footer></section><input id="files" type="file" multiple accept="image/*,video/*,audio/*,.mkv,.flac,.m4a" hidden><input id="subtitles" type="file" accept=".srt" hidden><script type="module" src="/simple-studio/static/edit
